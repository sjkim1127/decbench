name: C++ function identity candidate validation

on:
  push:
    branches:
      - ci/cpp-function-identity-candidate
    paths:
      - .github/workflows/cpp-function-identity-candidate.yml

permissions:
  contents: write

jobs:
  validate-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check -U pip
          python -m pip install -e . pytest pytest-cov ruff r2pipe

      - name: Normalize candidate style
        run: |
          python - <<'PY'
          from pathlib import Path

          kuna = Path("decbench/decompilers/raw/kuna_raw.py")
          text = kuna.read_text()
          old = """            enumerated = [(name, address) for name, address in enumerated if address in requested_addrs]\n"""
          new = """            enumerated = [\n                (name, address)\n                for name, address in enumerated\n                if address in requested_addrs\n            ]\n"""
          if old not in text:
              raise SystemExit("Kuna style target not found")
          kuna.write_text(text.replace(old, new, 1))

          test = Path("tests/test_function_identity.py")
          text = test.read_text()
          old = """    double_global = next(identity for identity in identities if identity.linkage_name == \"_Z7collided\")\n"""
          new = """    double_global = next(\n        identity for identity in identities if identity.linkage_name == \"_Z7collided\"\n    )\n"""
          if old not in text:
              raise SystemExit("identity-test style target not found")
          test.write_text(text.replace(old, new, 1))
          PY
          ruff check --fix --select I001 tests/test_function_identity.py

      - name: Static validation
        run: |
          python -m py_compile \
            decbench/decompilers/raw/angr_raw.py \
            decbench/decompilers/raw/binja_raw.py \
            decbench/decompilers/raw/dewolf_raw.py \
            decbench/decompilers/raw/ghidra_raw.py \
            decbench/decompilers/raw/ida_raw.py \
            decbench/decompilers/raw/kuna_raw.py \
            decbench/metrics/base.py \
            decbench/metrics/type_match.py \
            decbench/models/decompilation.py \
            decbench/utils/function_identity.py \
            decbench/utils/source_extract.py \
            scripts/run_benchmark.py \
            tests/test_cpp_identity_backends.py \
            tests/test_function_identity.py \
            tests/test_metric_function_identity.py \
            tests/test_run_benchmark_identity.py
          ruff check \
            decbench/decompilers/raw/angr_raw.py \
            decbench/decompilers/raw/binja_raw.py \
            decbench/decompilers/raw/dewolf_raw.py \
            decbench/decompilers/raw/ghidra_raw.py \
            decbench/decompilers/raw/ida_raw.py \
            decbench/decompilers/raw/kuna_raw.py \
            decbench/metrics/base.py \
            decbench/metrics/type_match.py \
            decbench/models/decompilation.py \
            decbench/utils/function_identity.py \
            decbench/utils/source_extract.py \
            scripts/run_benchmark.py \
            tests/test_cpp_identity_backends.py \
            tests/test_function_identity.py \
            tests/test_metric_function_identity.py \
            tests/test_run_benchmark_identity.py
          git diff --check origin/main...HEAD
          git diff --check

      - name: Focused C++ identity regressions
        run: |
          pytest -q \
            tests/test_run_benchmark_identity.py \
            tests/test_function_identity.py \
            tests/test_metric_function_identity.py \
            tests/test_cpp_identity_backends.py \
            tests/test_metrics.py \
            tests/test_models.py

      - name: Capture main full-suite baseline
        run: |
          git worktree add --detach /tmp/decbench-main origin/main
          python -m pip install --no-deps -e /tmp/decbench-main
          set +e
          (cd /tmp/decbench-main && COLUMNS=200 pytest -q --tb=short) | tee /tmp/main.log
          main_rc=${PIPESTATUS[0]}
          set -e
          grep '^FAILED ' /tmp/main.log | awk '{print $2}' | sort -u > /tmp/main.failures || true
          echo "main pytest rc=$main_rc"
          cat /tmp/main.failures || true

      - name: Candidate full suite introduces no failures
        run: |
          python -m pip install --no-deps -e .
          set +e
          COLUMNS=200 pytest -q --tb=short | tee /tmp/candidate.log
          candidate_rc=${PIPESTATUS[0]}
          set -e
          grep '^FAILED ' /tmp/candidate.log | awk '{print $2}' | sort -u > /tmp/candidate.failures || true
          comm -13 /tmp/main.failures /tmp/candidate.failures > /tmp/new.failures
          echo "candidate pytest rc=$candidate_rc"
          echo "candidate failures:"
          cat /tmp/candidate.failures || true
          if [ -s /tmp/new.failures ]; then
            echo "New failures relative to main:"
            cat /tmp/new.failures
            exit 1
          fi
          echo "Candidate introduces no new full-suite failures relative to main."

      - name: Commit verified style normalization to CI branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add decbench/decompilers/raw/kuna_raw.py tests/test_function_identity.py
          git commit -m "style: normalize C++ identity candidate"
          git push origin HEAD:ci/cpp-function-identity-candidate
