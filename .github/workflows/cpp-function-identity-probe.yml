name: C++ function identity probe

on:
  workflow_dispatch:
  push:
    branches:
      - analysis/cpp-function-identity-probe
    paths:
      - scripts/probe_cpp_function_identity.py
      - .github/workflows/cpp-function-identity-probe.yml
      - decbench/decompilers/raw/angr_raw.py
      - decbench/decompilers/raw/binja_raw.py
      - decbench/decompilers/raw/dewolf_raw.py
      - decbench/decompilers/raw/ghidra_raw.py
      - decbench/decompilers/raw/ida_raw.py
      - decbench/decompilers/raw/kuna_raw.py
      - decbench/models/decompilation.py
      - decbench/utils/function_identity.py
      - decbench/utils/source_extract.py
      - decbench/metrics/type_match.py
      - decbench/utils/binfmt.py
      - tests/test_cpp_identity_backends.py
      - tests/test_function_identity.py
      - tests/test_cpp_support.py
      - tests/test_dwarf_abstract_origin.py
      - tests/test_metrics.py
      - tests/test_models.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install DecBench
        run: |
          python -m pip install --disable-pip-version-check -U pip
          python -m pip install -e . pytest pytest-cov
          g++ --version | head -1

      - name: Compile touched Python modules
        run: |
          python -m py_compile \
            decbench/decompilers/raw/angr_raw.py \
            decbench/decompilers/raw/binja_raw.py \
            decbench/decompilers/raw/dewolf_raw.py \
            decbench/decompilers/raw/ghidra_raw.py \
            decbench/decompilers/raw/ida_raw.py \
            decbench/decompilers/raw/kuna_raw.py \
            decbench/models/decompilation.py \
            decbench/utils/function_identity.py \
            decbench/utils/source_extract.py \
            decbench/metrics/type_match.py

      - name: Run identity and metric regression tests
        run: |
          pytest -q \
            tests/test_cpp_support.py \
            tests/test_dwarf_abstract_origin.py \
            tests/test_cpp_identity_backends.py \
            tests/test_function_identity.py \
            tests/test_metrics.py \
            tests/test_models.py

      - name: Verify real C++ collision fixture
        run: |
          mkdir -p artifacts
          python scripts/probe_cpp_function_identity.py \
            --out artifacts/cpp-function-identity-probe.json

      - uses: actions/upload-artifact@v4
        with:
          name: cpp-function-identity-probe
          path: artifacts/cpp-function-identity-probe.json
          if-no-files-found: error
          retention-days: 30
