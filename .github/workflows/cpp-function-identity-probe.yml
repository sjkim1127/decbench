name: C++ function identity probe

on:
  workflow_dispatch:
  push:
    branches:
      - analysis/cpp-function-identity-probe
    paths:
      - scripts/probe_cpp_function_identity.py
      - scripts/dev_patch_type_match_identity.py
      - .github/workflows/cpp-function-identity-probe.yml
      - decbench/decompilers/raw/ghidra_raw.py
      - decbench/models/decompilation.py
      - decbench/utils/function_identity.py
      - decbench/utils/source_extract.py
      - decbench/metrics/type_match.py
      - decbench/utils/binfmt.py
      - tests/test_function_identity.py

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install DecBench
        run: |
          python -m pip install --disable-pip-version-check -U pip
          python -m pip install -e . pytest pytest-cov
          g++ --version | head -1

      - name: Apply staged TypeMatch identity patch
        run: |
          mkdir -p artifacts
          python scripts/dev_patch_type_match_identity.py \
            --output artifacts/type_match.py

      - name: Run C++ DWARF and identity regression tests
        run: |
          pytest -q \
            tests/test_cpp_support.py \
            tests/test_dwarf_abstract_origin.py \
            tests/test_function_identity.py

      - name: Reproduce name-key collision on real C++ DWARF
        run: |
          python scripts/probe_cpp_function_identity.py \
            --out artifacts/cpp-function-identity-probe.json

      - name: Commit validated TypeMatch source to analysis branch
        run: |
          if git diff --quiet -- decbench/metrics/type_match.py; then
            echo "type_match.py already finalized"
            exit 0
          fi
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git add decbench/metrics/type_match.py
          git commit -m "type-match: join C++ ground truth by function address [skip ci]"
          git push origin HEAD:analysis/cpp-function-identity-probe

      - uses: actions/upload-artifact@v4
        with:
          name: cpp-function-identity-probe
          path: |
            artifacts/cpp-function-identity-probe.json
            artifacts/type_match.py
          if-no-files-found: error
          retention-days: 30
