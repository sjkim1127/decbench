name: C++ function identity PE probe

on:
  push:
    branches:
      - ci/cpp-function-identity-pe-probe

permissions:
  contents: read

jobs:
  pe-dwarf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MinGW and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64
          x86_64-w64-mingw32-g++ --version
          python -m pip install --disable-pip-version-check -U pip
          python -m pip install -e . pytest pytest-cov ruff
      - name: Validate real PE DWARF identity
        run: |
          ruff check tests/test_cpp_identity_pe_probe.py
          pytest -q tests/test_cpp_identity_pe_probe.py
