name: Apply canonical DWARF relabel patch

on:
  push:
    branches:
      - analysis/cpp-function-identity-probe
    paths:
      - .github/workflows/apply-canonical-relabel.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check -U pip
          python -m pip install -e . pytest pytest-cov ruff r2pipe
          g++ --version | head -1

      - name: Capture pre-patch full-suite baseline
        run: |
          set +e
          COLUMNS=200 pytest -q --tb=short | tee /tmp/baseline.log
          echo "${PIPESTATUS[0]}" > /tmp/baseline.rc
          set -e
          grep '^FAILED ' /tmp/baseline.log | awk '{print $2}' | sort -u > /tmp/baseline.failures || true
          echo "baseline pytest rc=$(cat /tmp/baseline.rc)"
          echo "baseline failures:"
          cat /tmp/baseline.failures || true

      - name: Apply patch
        run: python scripts/apply_canonical_identity_patch.py

      - name: Normalize touched imports
        run: ruff check --fix --select I001 decbench/utils/source_extract.py

      - name: Static validation
        run: |
          python -m py_compile \
            scripts/run_benchmark.py \
            decbench/utils/source_extract.py \
            tests/test_run_benchmark_identity.py
          ruff check \
            scripts/run_benchmark.py \
            decbench/utils/source_extract.py \
            tests/test_run_benchmark_identity.py
          git diff --check

      - name: Focused canonical identity regressions
        run: |
          pytest -q \
            tests/test_run_benchmark_identity.py \
            tests/test_function_identity.py \
            tests/test_metric_function_identity.py \
            tests/test_cpp_identity_backends.py \
            tests/test_metrics.py \
            tests/test_models.py

      - name: Full suite must introduce no new failures
        run: |
          set +e
          COLUMNS=200 pytest -q --tb=short | tee /tmp/patched.log
          patched_rc=${PIPESTATUS[0]}
          set -e
          grep '^FAILED ' /tmp/patched.log | awk '{print $2}' | sort -u > /tmp/patched.failures || true
          comm -13 /tmp/baseline.failures /tmp/patched.failures > /tmp/new.failures
          echo "patched pytest rc=$patched_rc"
          echo "patched failures:"
          cat /tmp/patched.failures || true
          if [ -s /tmp/new.failures ]; then
            echo "New failures introduced by canonical identity patch:"
            cat /tmp/new.failures
            exit 1
          fi
          echo "No new failures relative to the pre-patch baseline."

      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/run_benchmark.py \
            decbench/utils/source_extract.py \
            .github/workflows/cpp-function-identity-probe.yml
          git commit -m "fix: canonicalize benchmark function identity"
          git push origin HEAD:analysis/cpp-function-identity-probe
