name: Apply canonical DWARF relabel patch

on:
  push:
    branches:
      - analysis/cpp-function-identity-probe
    paths:
      - .github/workflows/apply-canonical-relabel.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply canonical identity patch
        run: |
          python - <<'PY'
          from pathlib import Path

          run_path = Path("scripts/run_benchmark.py")
          text = run_path.read_text()
          start = text.index("def _relabel_to_dwarf(")
          end = text.index("\n\ndef _timed_decompile(", start)
          replacement = '''def _relabel_to_dwarf(
              result: DecompilationResult, addr2name: dict[int, str], unstripped: Path
          ) -> None:
              """Canonicalize stripped-binary results against the full DWARF target set.

              ``addr2name`` is the benchmark universe for this binary: every requested
              source function keyed by its DWARF ``low_pc``.  Storage identity must be
              derived from that complete set, not from whichever subset one decompiler
              happened to recover.  A source name that is ambiguous anywhere in the
              target set therefore always uses ``<name>@0x<low_pc>`` -- even when this
              particular backend recovered only one of the colliding functions.

              Backend addresses are normalized back to the canonical DWARF ``low_pc``
              (including historical PE-RVA and Thumb-bit variants), so address-keyed
              metrics and source recovery consume the same identity primitive.  Output
              that cannot be mapped to a requested target is dropped: the decompiler was
              explicitly gated to ``addr2name`` and such rows are outside the benchmark
              universe.
              """
              from decbench.decompilers.raw import common

              base = common.elf_min_vaddr(unstripped)

              name_counts: dict[str, int] = {}
              for target_name in addr2name.values():
                  name_counts[target_name] = name_counts.get(target_name, 0) + 1
              ambiguous_names = {name for name, count in name_counts.items() if count > 1}

              def storage_key(name: str, address: int) -> str:
                  if name in ambiguous_names:
                      return f"{name}@0x{address:x}"
                  return name

              def dwarf_target(raw_address: int) -> tuple[int, str] | None:
                  candidates = (
                      raw_address,
                      raw_address & ~1,
                      raw_address + base,
                      (raw_address + base) & ~1,
                  )
                  seen: set[int] = set()
                  for candidate in candidates:
                      if candidate in seen:
                          continue
                      seen.add(candidate)
                      target_name = addr2name.get(candidate)
                      if target_name is not None:
                          return candidate, target_name
                  return None

              new_funcs: dict[str, object] = {}
              recovered_targets: set[int] = set()
              dropped_unmapped = 0

              for fd in list(result.functions.values()):
                  target = dwarf_target(int(fd.address))
                  if target is None:
                      dropped_unmapped += 1
                      continue

                  target_address, target_name = target
                  recovered_targets.add(target_address)
                  old_name = fd.name
                  if target_name != old_name:
                      fd.decompiled_code = re.sub(
                          r"\\b" + re.escape(old_name) + r"\\b",
                          target_name,
                          fd.decompiled_code,
                      )
                  fd.name = target_name
                  fd.address = target_address

                  key = storage_key(target_name, target_address)
                  previous = new_funcs.get(key)
                  if previous is None or len(fd.decompiled_code or "") >= len(
                      getattr(previous, "decompiled_code", "") or ""
                  ):
                      new_funcs[key] = fd

              result.functions = new_funcs  # type: ignore[assignment]

              # A timeout/no-result marker remains compact.  Otherwise derive failures
              # from the complete target universe so partial backends use exactly the
              # same canonical keys as successful backends.
              was_all_failure = result.decompiler.failed_functions == ["all"]
              missing = [
                  storage_key(addr2name[address], address)
                  for address in sorted(addr2name)
                  if address not in recovered_targets
              ]
              if not (was_all_failure and not recovered_targets):
                  result.decompiler.failed_functions = missing

              result.decompiler.extra = {
                  **(result.decompiler.extra or {}),
                  "function_identity": "dwarf-low-pc",
                  "ambiguous_source_names": len(ambiguous_names),
                  "dropped_unmapped_functions": dropped_unmapped,
              }
              result.binary_path = unstripped
          '''
          run_path.write_text(text[:start] + replacement + text[end:])

          source_path = Path("decbench/utils/source_extract.py")
          source = source_path.read_text()
          needle = '''    if binary_path is None:\n        return None, "binary_not_found"\n    binary_path = Path(binary_path)\n'''
          replacement = '''    # Report/evaluation layers may carry DecBench's canonical storage key\n    # rather than the semantic source name.  Decode it here so every existing\n    # caller automatically gets address-aware C++ source recovery.\n    if func_address is None:\n        storage_match = re.fullmatch(r"(.+)@0x([0-9a-fA-F]+)", func_name)\n        if storage_match is not None:\n            func_name = storage_match.group(1)\n            func_address = int(storage_match.group(2), 16)\n\n    if binary_path is None:\n        return None, "binary_not_found"\n    binary_path = Path(binary_path)\n'''
          if needle not in source:
              raise SystemExit("source_extract insertion point not found")
          source_path.write_text(source.replace(needle, replacement, 1))

          workflow_path = Path(".github/workflows/cpp-function-identity-probe.yml")
          workflow = workflow_path.read_text()
          workflow = workflow.replace(
              "      - scripts/probe_cpp_function_identity.py\n",
              "      - scripts/probe_cpp_function_identity.py\n      - scripts/run_benchmark.py\n",
              1,
          )
          workflow = workflow.replace(
              "      - tests/test_function_identity.py\n",
              "      - tests/test_function_identity.py\n      - tests/test_run_benchmark_identity.py\n",
              1,
          )
          workflow = workflow.replace(
              "            decbench/metrics/type_match.py\n",
              "            decbench/metrics/type_match.py \\\n            scripts/run_benchmark.py\n",
              1,
          )
          workflow = workflow.replace(
              "      - name: Lint touched Python files\n        continue-on-error: true\n",
              "      - name: Lint touched Python files\n",
              1,
          )
          workflow = workflow.replace(
              "            tests/test_function_identity.py\n",
              "            tests/test_function_identity.py \\\n            tests/test_run_benchmark_identity.py\n",
              1,
          )
          workflow = workflow.replace(
              "            tests/test_models.py\n",
              "            tests/test_models.py \\\n            tests/test_run_benchmark_identity.py\n",
              1,
          )
          workflow_path.write_text(workflow)

          test_path = Path("tests/test_run_benchmark_identity.py")
          test_path.write_text(r'''"""Regression tests for canonical DWARF identity in the benchmark driver."""

from __future__ import annotations

import importlib.util
import shutil
import subprocess
from pathlib import Path

import pytest

from decbench.models.decompilation import (
    DecompilationResult,
    DecompilerMetadata,
    FunctionDecompilation,
)
from decbench.utils.function_identity import dwarf_function_identities
from decbench.utils.source_extract import function_source_ex


def _load_driver():
    path = Path(__file__).resolve().parents[1] / "scripts" / "run_benchmark.py"
    spec = importlib.util.spec_from_file_location("decbench_run_benchmark_identity_test", path)
    assert spec is not None and spec.loader is not None
    module = importlib.util.module_from_spec(spec)
    spec.loader.exec_module(module)
    return module


def _fd(name: str, address: int, body: str | None = None) -> FunctionDecompilation:
    return FunctionDecompilation(
        name=name,
        address=address,
        decompiled_code=body or f"int {name}(void) {{ return 1; }}",
    )


def _result(*functions: FunctionDecompilation, failed: list[str] | None = None):
    return DecompilationResult(
        binary_path=Path("stripped.bin"),
        binary_name="fixture",
        decompiler=DecompilerMetadata(
            decompiler_name="fixture",
            failed_functions=list(failed or []),
        ),
        functions={f"raw-{index}": function for index, function in enumerate(functions)},
    )


def test_relabel_uses_full_target_set_for_ambiguous_storage_keys(monkeypatch):
    driver = _load_driver()
    from decbench.decompilers.raw import common

    monkeypatch.setattr(common, "elf_min_vaddr", lambda _path: 0)
    targets = {0x1000: "same", 0x2000: "same", 0x3000: "unique"}

    complete = _result(_fd("sub_1000", 0x1000), _fd("sub_2000", 0x2000))
    partial = _result(_fd("FUN_1000", 0x1000), _fd("FUN_3000", 0x3000))

    driver._relabel_to_dwarf(complete, targets, Path("unstripped.bin"))
    driver._relabel_to_dwarf(partial, targets, Path("unstripped.bin"))

    assert set(complete.functions) == {"same@0x1000", "same@0x2000"}
    assert set(partial.functions) == {"same@0x1000", "unique"}
    assert partial.functions["same@0x1000"].name == "same"
    assert partial.functions["same@0x1000"].address == 0x1000
    assert partial.decompiler.failed_functions == ["same@0x2000"]
    assert partial.decompiler.extra["function_identity"] == "dwarf-low-pc"


def test_relabel_normalizes_historical_pe_rva_to_dwarf_low_pc(monkeypatch):
    driver = _load_driver()
    from decbench.decompilers.raw import common

    monkeypatch.setattr(common, "elf_min_vaddr", lambda _path: 0x400000)
    result = _result(_fd("sub_1000", 0x1000))

    driver._relabel_to_dwarf(result, {0x401000: "target"}, Path("unstripped.exe"))

    assert set(result.functions) == {"target"}
    assert result.functions["target"].address == 0x401000
    assert result.functions["target"].name == "target"
    assert "target" in result.functions["target"].decompiled_code
    assert result.decompiler.failed_functions == []


def test_relabel_preserves_compact_all_failure_marker(monkeypatch):
    driver = _load_driver()
    from decbench.decompilers.raw import common

    monkeypatch.setattr(common, "elf_min_vaddr", lambda _path: 0)
    result = _result(failed=["all"])

    driver._relabel_to_dwarf(
        result,
        {0x1000: "same", 0x2000: "same"},
        Path("unstripped.bin"),
    )

    assert result.functions == {}
    assert result.decompiler.failed_functions == ["all"]


@pytest.mark.skipif(shutil.which("g++") is None, reason="g++ required")
def test_source_extract_accepts_canonical_storage_key(tmp_path: Path):
    source = tmp_path / "collision.cpp"
    source.write_text(
        "int collide(int x) { return x + 11; }\n"
        "double collide(double x) { return x + 22.0; }\n"
        "int main() { return collide(1); }\n"
    )
    binary = tmp_path / "collision"
    subprocess.run(
        ["g++", "-O0", "-g", str(source), "-o", str(binary)],
        check=True,
        capture_output=True,
        text=True,
    )

    identities = dwarf_function_identities(binary)
    int_overload = next(i for i in identities if i.linkage_name == "_Z7collidei")
    storage_key = f"collide@0x{int_overload.address:x}"

    snippet, status = function_source_ex(binary, storage_key)

    assert status == ""
    assert snippet is not None
    assert "return x + 11" in snippet
    assert "return x + 22.0" not in snippet
''')
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check -U pip
          python -m pip install -e . pytest pytest-cov ruff
          g++ --version | head -1

      - name: Static validation
        run: |
          python -m py_compile \
            scripts/run_benchmark.py \
            decbench/utils/source_extract.py \
            tests/test_run_benchmark_identity.py
          ruff check \
            scripts/run_benchmark.py \
            decbench/utils/source_extract.py \
            tests/test_run_benchmark_identity.py
          git diff --check

      - name: Focused canonical identity regressions
        run: |
          pytest -q \
            tests/test_run_benchmark_identity.py \
            tests/test_function_identity.py \
            tests/test_metric_function_identity.py \
            tests/test_cpp_identity_backends.py \
            tests/test_metrics.py \
            tests/test_models.py

      - name: Full test suite
        run: pytest -q

      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/run_benchmark.py \
            decbench/utils/source_extract.py \
            tests/test_run_benchmark_identity.py \
            .github/workflows/cpp-function-identity-probe.yml
          git commit -m "fix: canonicalize benchmark function identity"
          git push origin HEAD:analysis/cpp-function-identity-probe
