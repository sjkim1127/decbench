name: C++ function identity exact clean final

on:
  push:
    branches:
      - ci/cpp-function-identity-exact-clean-final

permissions:
  contents: read

jobs:
  exact-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Assert exact clean parent
        run: |
          test "$(git rev-parse HEAD^)" = "1fdedb5124debedc3052e2171c70a8228705e0fb"
          test "$(git rev-parse HEAD^^)" = "5818d673b2ec91d0889897260ac6d7459e9ae326"
      - name: Install
        run: |
          python -m pip install --disable-pip-version-check -U pip
          python -m pip install -e . pytest pytest-cov ruff r2pipe
      - name: Static validation
        run: |
          ruff check \
            decbench/decompilers/raw/angr_raw.py \
            decbench/decompilers/raw/binja_raw.py \
            decbench/decompilers/raw/dewolf_raw.py \
            decbench/decompilers/raw/ghidra_raw.py \
            decbench/decompilers/raw/ida_raw.py \
            decbench/decompilers/raw/kuna_raw.py \
            decbench/metrics/base.py \
            decbench/metrics/byte_match.py \
            decbench/metrics/type_match.py \
            decbench/models/decompilation.py \
            decbench/scoring/report_extras.py \
            decbench/utils/function_identity.py \
            decbench/utils/results_tree.py \
            decbench/utils/source_extract.py \
            scripts/rebuild_function_data.py \
            scripts/reeval_bytematch.py \
            scripts/run_benchmark.py \
            tests/test_cpp_identity_backends.py \
            tests/test_cpp_identity_deep_validation.py \
            tests/test_cpp_identity_end_to_end.py \
            tests/test_cpp_identity_optimized_dwarf.py \
            tests/test_cpp_identity_progress.py \
            tests/test_cpp_identity_thumb.py \
            tests/test_function_identity.py \
            tests/test_metric_function_identity.py \
            tests/test_run_benchmark_identity.py
          python -m py_compile \
            decbench/utils/function_identity.py \
            decbench/utils/results_tree.py \
            decbench/models/decompilation.py \
            decbench/metrics/byte_match.py \
            decbench/scoring/report_extras.py \
            scripts/rebuild_function_data.py \
            scripts/reeval_bytematch.py \
            scripts/run_benchmark.py
          git diff --check 5818d673b2ec91d0889897260ac6d7459e9ae326..HEAD^
      - name: Focused identity regressions
        run: |
          pytest -q \
            tests/test_cpp_identity_end_to_end.py \
            tests/test_cpp_identity_deep_validation.py \
            tests/test_cpp_identity_optimized_dwarf.py \
            tests/test_cpp_identity_progress.py \
            tests/test_run_benchmark_identity.py \
            tests/test_function_identity.py \
            tests/test_metric_function_identity.py \
            tests/test_cpp_identity_backends.py
      - name: Capture main full-suite baseline
        run: |
          git worktree add --detach /tmp/decbench-main 5818d673b2ec91d0889897260ac6d7459e9ae326
          python -m pip install --no-deps -e /tmp/decbench-main
          set +e
          (cd /tmp/decbench-main && COLUMNS=200 pytest -q --tb=short \
            -k 'not test_cgroup_limit_kills_the_whole_descendant_tree') | tee /tmp/main.log
          main_rc=${PIPESTATUS[0]}
          set -e
          grep '^FAILED ' /tmp/main.log | awk '{print $2}' | sort -u > /tmp/main.failures || true
          echo "main pytest rc=$main_rc"
          cat /tmp/main.failures || true
      - name: Exact clean candidate introduces no failures
        run: |
          python -m pip install --no-deps -e .
          set +e
          COLUMNS=200 pytest -q --tb=short \
            -k 'not test_cgroup_limit_kills_the_whole_descendant_tree' | tee /tmp/candidate.log
          candidate_rc=${PIPESTATUS[0]}
          set -e
          grep '^FAILED ' /tmp/candidate.log | awk '{print $2}' | sort -u > /tmp/candidate.failures || true
          comm -13 /tmp/main.failures /tmp/candidate.failures > /tmp/new.failures
          echo "candidate pytest rc=$candidate_rc"
          cat /tmp/candidate.failures || true
          if [ -s /tmp/new.failures ]; then
            echo "New failures relative to main:"
            cat /tmp/new.failures
            exit 1
          fi
          echo "Exact clean candidate introduces no new full-suite failures relative to main."
