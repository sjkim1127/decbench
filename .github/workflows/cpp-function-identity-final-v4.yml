name: C++ function identity final validation v4

on:
  push:
    branches:
      - ci/cpp-function-identity-final-v4

permissions:
  contents: read

env:
  FLAKY_CGROUP_TEST: tests/test_decompiler_limits.py::test_cgroup_limit_kills_the_whole_descendant_tree

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y lld
          ld.lld --version
          python -m pip install --disable-pip-version-check -U pip
          python -m pip install -e . pytest pytest-cov ruff r2pipe
      - name: Static and focused validation
        run: |
          ruff check \
            decbench/decompilers/raw/angr_raw.py \
            decbench/decompilers/raw/binja_raw.py \
            decbench/decompilers/raw/dewolf_raw.py \
            decbench/decompilers/raw/ghidra_raw.py \
            decbench/decompilers/raw/ida_raw.py \
            decbench/decompilers/raw/kuna_raw.py \
            decbench/metrics/base.py \
            decbench/metrics/byte_match.py \
            decbench/metrics/type_match.py \
            decbench/models/decompilation.py \
            decbench/scoring/report_extras.py \
            decbench/utils/binfmt.py \
            decbench/utils/function_identity.py \
            decbench/utils/results_tree.py \
            decbench/utils/source_extract.py \
            scripts/rebuild_function_data.py \
            scripts/reeval_bytematch.py \
            scripts/run_benchmark.py \
            tests/test_cpp_identity_backends.py \
            tests/test_cpp_identity_deep_validation.py \
            tests/test_cpp_identity_end_to_end.py \
            tests/test_cpp_identity_icf.py \
            tests/test_cpp_identity_optimized_dwarf.py \
            tests/test_cpp_identity_progress.py \
            tests/test_cpp_identity_thumb.py \
            tests/test_function_identity.py \
            tests/test_metric_function_identity.py \
            tests/test_run_benchmark_identity.py
          git diff --check origin/main...HEAD
          pytest -q \
            tests/test_cpp_identity_end_to_end.py \
            tests/test_cpp_identity_icf.py \
            tests/test_cpp_identity_deep_validation.py \
            tests/test_cpp_identity_optimized_dwarf.py \
            tests/test_cpp_identity_progress.py \
            tests/test_run_benchmark_identity.py \
            tests/test_function_identity.py \
            tests/test_metric_function_identity.py \
            tests/test_cpp_identity_backends.py
      - name: Capture main full-suite baseline
        run: |
          git worktree add --detach /tmp/decbench-main origin/main
          python -m pip install --no-deps -e /tmp/decbench-main
          set +e
          (cd /tmp/decbench-main && COLUMNS=200 pytest -q --tb=short --deselect="$FLAKY_CGROUP_TEST") | tee /tmp/main.log
          main_rc=${PIPESTATUS[0]}
          set -e
          grep '^FAILED ' /tmp/main.log | awk '{print $2}' | sort -u > /tmp/main.failures || true
          echo "main pytest rc=$main_rc"
          cat /tmp/main.failures || true
      - name: Candidate full suite introduces no failures
        run: |
          python -m pip install --no-deps -e .
          set +e
          COLUMNS=200 pytest -q --tb=short --deselect="$FLAKY_CGROUP_TEST" | tee /tmp/candidate.log
          candidate_rc=${PIPESTATUS[0]}
          set -e
          grep '^FAILED ' /tmp/candidate.log | awk '{print $2}' | sort -u > /tmp/candidate.failures || true
          comm -13 /tmp/main.failures /tmp/candidate.failures > /tmp/new.failures
          echo "candidate pytest rc=$candidate_rc"
          cat /tmp/candidate.failures || true
          if [ -s /tmp/new.failures ]; then
            echo "New failures relative to main:"
            cat /tmp/new.failures
            exit 1
          fi
          echo "Candidate introduces no new full-suite failures relative to main."

  arm-thumb:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi
          arm-none-eabi-g++ --version
          python -m pip install --disable-pip-version-check -U pip
          python -m pip install -e . pytest pytest-cov
      - name: Run Thumb identity regressions
        run: pytest -q tests/test_arm_thumb_extraction.py tests/test_cpp_identity_thumb.py

  leveldb-cross-decompiler:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install DecBench and PyGhidra
        run: |
          python -m pip install --disable-pip-version-check -U pip
          python -m pip install -e . pytest pytest-cov pyghidra ruff
          ruff check scripts/validate_leveldb_cross_decompiler_identity.py
          python -m py_compile scripts/validate_leveldb_cross_decompiler_identity.py
      - name: Install Ghidra 12.0.4
        run: |
          url='https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.0.4_build/ghidra_12.0.4_PUBLIC_20260303.zip'
          curl -L --fail --retry 3 "$url" -o /tmp/ghidra.zip
          echo 'c3b458661d69e26e203d739c0c82d143cc8a4a29d9e571f099c2cf4bda62a120  /tmp/ghidra.zip' | sha256sum -c -
          unzip -q /tmp/ghidra.zip -d /tmp
          install_dir="$(find /tmp -maxdepth 1 -type d -name 'ghidra_12.0.4*' | head -1)"
          test -n "$install_dir"
          echo "GHIDRA_INSTALL_DIR=$install_dir" >> "$GITHUB_ENV"
      - name: Build pinned LevelDB 1.23 with DWARF
        run: |
          git clone --depth 1 --branch 1.23 https://github.com/google/leveldb.git /tmp/leveldb
          cmake -S /tmp/leveldb -B /tmp/leveldb/build \
            -DCMAKE_BUILD_TYPE= \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_FLAGS='-O0 -g -fno-builtin -save-temps=obj' \
            -DLEVELDB_BUILD_TESTS=OFF \
            -DLEVELDB_BUILD_BENCHMARKS=OFF \
            -DBUILD_SHARED_LIBS=ON
          cmake --build /tmp/leveldb/build -j2
      - name: Compare angr and Ghidra canonical keys
        run: |
          binary="$(find /tmp/leveldb/build -type f -name 'libleveldb.so*' | sort | head -1)"
          test -n "$binary"
          python scripts/validate_leveldb_cross_decompiler_identity.py "$binary"
          cat /tmp/leveldb-cross-identity.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leveldb-cross-decompiler-identity-final-v4
          path: /tmp/leveldb-cross-identity.json
          if-no-files-found: ignore
